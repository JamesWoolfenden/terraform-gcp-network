id: HLD_PROPOSED_001
name: GCP routes must not send default internet-bound traffic through the default internet gateway
principle: network-security
severity: HIGH
rationale: |
  A google_compute_route with dest_range = "0.0.0.0/0" and
  next_hop_gateway = "default-internet-gateway" reproduces GCP's implicit
  default internet route as an explicit resource. This is the same
  unrestricted egress path that delete_default_routes_on_create is meant to
  remove, so declaring it explicitly (for example as a 'replacement' route
  required by HLD_GCP_303) silently restores unconditioned internet access
  for every instance on the network. Routes that send 0.0.0.0/0 to a Cloud
  NAT instance, internal load balancer, or NVA next-hop are unaffected by
  this check — only the direct default-internet-gateway next-hop is unsafe.
remediation: |
  Route default egress through a controlled path instead of the default
  internet gateway, for example via Cloud NAT:

    resource "google_compute_router" "router" {
      name    = "${var.name}-router"
      network = google_compute_network.vpc.name
    }

    resource "google_compute_router_nat" "nat" {
      name                               = "${var.name}-nat"
      router                             = google_compute_router.router.name
      nat_ip_allocate_option             = "AUTO_ONLY"
      source_subnetwork_ip_ranges_to_nat = "ALL_SUBNETWORKS_ALL_IP_RANGES"
    }

  If a static route is genuinely required, point next_hop at an NVA instance
  or internal load balancer rather than next_hop_gateway =
  "default-internet-gateway".
resources:
  google_compute_route:
    any:
      - path: dest_range
        not_equals: "0.0.0.0/0"
      - path: next_hop_gateway
        not_equals: "default-internet-gateway"
